{% extends 'shop/layout.html' %}

{% block title %}Видалення товару{% endblock %}

{% block content %}
<h2>Видалити товар "{{ product.name }}"?</h2>

<form method="post">{% csrf_token %}

    <a href="{% url 'product_list' %}">Скасувати</a>
</form>
{% endblock %}
