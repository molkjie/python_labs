<!DOCTYPE html>
<html lang="uk">
{% load static %}
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Мій магазин{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'shop/css/styles.css' %}">
</head>
<body>
    <header>
        <h1>Магазин товарів</h1>
        <nav>
            <a href="{% url 'product_list' %}">Товари</a> |
            <a href="{% url 'category_list' %}">Категорії</a>
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>&copy; 2025 Мій магазин</p>
    </footer>
</body>
</html>
