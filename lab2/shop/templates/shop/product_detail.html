{% extends 'shop/layout.html' %}

{% block title %}Деталі товару{% endblock %}

{% block content %}
<h2>{{ product.name }}</h2>

<p>Ціна: {{ product.price }} грн</p>
<p>Категорія: {{ product.category.name }}</p>
<p>Опис: {{ product.description }}</p>

<p>
    <a href="{% url 'product_update' product.pk %}">Редагувати</a> |
    <a href="{% url 'product_delete' product.pk %}">Видалити</a> |
    <a href="{% url 'product_list' %}">Назад до списку</a>
</p>

<form action="{% url 'cart_add' product.id %}" method="post">
  {% csrf_token %}
  <input type="number" name="quantity" value="1" min="1" />
  <button type="submit">Додати в корзину</button>
</form>

{% endblock %}
